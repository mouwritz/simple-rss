name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No signing certificates configured: build unsigned installers.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: simple-rss-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
      - name: Attach installers to GitHub release
        if: ${{ inputs.tag != '' }}
        shell: bash
        run: |
          shopt -s nullglob
          gh release upload "${{ inputs.tag }}" dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
